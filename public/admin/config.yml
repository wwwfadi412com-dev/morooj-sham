              - { name: whatsappMessage, label: رسالة واتساب لطلب عرض السعر, widget: text }
              - { name: rangePercent, label: هامش التقدير (±%), widget: number, value_type: int, min: 0, max: 50, hint: "15 يعني عرض النتيجة كنطاق ±15%" }
