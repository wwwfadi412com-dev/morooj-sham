          - { name: longTerm, label: الإيجار الشهري والسنوي, widget: object, collapsed: true, fields: *listingFields }
          - { name: areasIndex, label: صفحة المناطق, widget: object, collapsed: true, fields: *listingFields }
          - { name: blogIndex, label: صفحة المقالات, widget: object, collapsed: true, fields: *listingFields }

      - name: categories
        label: أسماء أنواع العقارات
