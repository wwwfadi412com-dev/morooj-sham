              - { name: saleDescription, label: وصف صفحة البيع وSEO, widget: text }
          - { name: villa, label: فيلا, widget: object, collapsed: true, fields: *categoryFields }
          - { name: apartment, label: شقة, widget: object, collapsed: true, fields: *categoryFields }
          - { name: land, label: أرض, widget: object, collapsed: true, fields: *categoryFields }

      - name: contracting
        label: التعهدات والإكساء (والحاسبة)
        file: content/pages/contracting.json
        fields:
          - name: seo
            label: SEO
            widget: object
            fields:
              - { name: title, label: عنوان الصفحة في جوجل, widget: string }
              - { name: description, label: الوصف في نتائج البحث, widget: text }
          - name: hero
            label: الواجهة
            widget: object
            fields:
              - { name: badge, label: الشارة, widget: string }
              - { name: title, label: العنوان (H1), widget: string }
              - { name: subtitle, label: النص تحت العنوان, widget: text }
