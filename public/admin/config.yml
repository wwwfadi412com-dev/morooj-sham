          - { name: servicesTitle, label: عنوان قسم الخدمات, widget: string }
          - { name: servicesSubtitle, label: نص قسم الخدمات, widget: string }
          - name: services
            label: الخدمات
            widget: list
            fields:
              - name: icon
                label: الأيقونة
                widget: select
                options:
                  - { label: مبنى, value: building }
                  - { label: رول دهان, value: paint }
                  - { label: قطرات ماء, value: droplets }
                  - { label: مطرقة, value: hammer }
                  - { label: شمس, value: sun }
                  - { label: مسطرة, value: ruler }
              - { name: title, label: اسم الخدمة, widget: string }
              - { name: text, label: الوصف, widget: text }
              - { name: image, label: الصورة, widget: image }
              - { name: points, label: نقاط مختصرة, widget: list, field: { name: point, label: نقطة, widget: string } }
          - name: weekly
            label: نظام التوثيق الأسبوعي للمغتربين
