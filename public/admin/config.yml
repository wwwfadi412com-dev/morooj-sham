# Sveltia CMS configuration (Decap/Netlify CMS compatible).
# Every save commits to GitHub; .github/workflows/deploy.yml then rebuilds the site.
# scripts/build-content.mjs validates entries and fails the build on bad data.

backend:
  name: github
  repo: wwwfadi412com-dev/morooj-sham
  branch: main
  commit_messages:
    create: "إضافة {{collection}}: {{slug}}"
    update: "تعديل {{collection}}: {{slug}}"
    delete: "حذف {{collection}}: {{slug}}"
    uploadMedia: "رفع صورة: {{path}}"
    deleteMedia: "حذف صورة: {{path}}"

site_url: https://wwwfadi412com-dev.github.io/morooj-sham/
display_url: https://wwwfadi412com-dev.github.io/morooj-sham/
logo_url: https://wwwfadi412com-dev.github.io/morooj-sham/icon.svg

media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: properties
    label: العقارات
    label_singular: عقار
    description: أضف العقارات وعدّلها. لتعليم عقار كمباع غيّر «الحالة» إلى «تم البيع» ولا تحذفه.
    folder: content/properties
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{type}}-{{area}}-{{code}}"
    identifier_field: code
    summary: "{{code}} — {{title}}"
    sortable_fields: [publishedAt, code, price, title]
    view_filters:
      - { label: متاح, field: status, pattern: available }
      - { label: تم البيع, field: status, pattern: sold }
      - { label: للبيع, field: transaction, pattern: sale }
      - { label: إيجار يومي, field: transaction, pattern: daily-rent }
    fields:
      - { name: code, label: كود العقار, widget: string, hint: "مثال: D-140 للدرخبية، DR-240 لدروشا، KH-330 لخان الشيح، AR-450 لعرطوز. يجب ألا يتكرر.", pattern: ['^[A-Za-z]{1,3}-\d+$', "الصيغة: حروف ثم شرطة ثم رقم، مثل D-140"] }
      - { name: title, label: عنوان العقار, widget: string, hint: "مثال: مزرعة للبيع في الدرخبية بمساحة 3 دونم مع مسبح" }
      - name: type
        label: نوع العقار
        widget: select
        options:
          - { label: مزرعة, value: farm }
          - { label: فيلا / منزل مستقل, value: villa }
          - { label: شقة سكنية, value: apartment }
          - { label: أرض / مقسم, value: land }
      - name: transaction
        label: نوع العملية
        widget: select
        options:
          - { label: للبيع, value: sale }
          - { label: إيجار يومي / سياحي, value: daily-rent }
          - { label: إيجار شهري / سنوي, value: long-term-rent }
      - { name: area, label: المنطقة, widget: relation, collection: areas, value_field: "{{slug}}", search_fields: [name, fullName], display_fields: [fullName], hint: لإضافة منطقة جديدة استخدم قسم «المناطق» }
      - name: status
        label: الحالة
        widget: select
        default: available
        options:
          - { label: متاح, value: available }
          - { label: تم البيع, value: sold }
          - { label: مؤجر حالياً, value: rented }
      - { name: featured, label: عقار مميز, widget: boolean, default: false, required: false }
      - { name: needsFinishing, label: عظم / بحاجة إكساء, widget: boolean, default: false, required: false, hint: "يُظهر صندوق «هل ترغب باستلام هذا العقار جاهزاً ع المفتاح؟». يظهر تلقائياً لكل الأراضي." }
      - { name: price, label: السعر بالدولار, widget: number, value_type: int, min: 1, hint: "للبيع: السعر الكامل. للإيجار اليومي: سعر اليوم. للإيجار الشهري: سعر الشهر." }
      - { name: landArea, label: المساحة الإجمالية (م²), widget: number, value_type: int, required: false, hint: "الدونم = 1000 م²" }
      - { name: builtArea, label: مساحة البناء (م²), widget: number, value_type: int, required: false }
      - { name: bedrooms, label: غرف النوم, widget: number, value_type: int, required: false }
      - { name: bathrooms, label: الحمامات, widget: number, value_type: int, required: false }
      - { name: capacity, label: السعة (عدد الأشخاص), widget: number, value_type: int, required: false, hint: للإيجار اليومي فقط }
      - name: deed
        label: نوع الملكية
        widget: select
        options:
          - { label: طابو أخضر, value: green-tabu }
          - { label: طابو زراعي, value: agricultural-tabu }
          - { label: حكم محكمة, value: court-ruling }
          - { label: كاتب عدل, value: notary }
      - { name: deedDetail, label: تفاصيل الملكية, widget: string, hint: "مثال: طابو أخضر 2400 سهم" }
      - { name: locationNote, label: وصف الموقع, widget: string, hint: "تقريبي فقط، بدون عنوان دقيق. مثال: الدرخبية - 5 دقائق عن الأوتستراد" }
      - { name: water, label: مصادر المياه, widget: string }
      - { name: electricity, label: الكهرباء والطاقة, widget: string }
      - { name: amenities, label: المرافق, widget: list, field: { name: item, label: ميزة, widget: string }, hint: "مثال: مسبح مفلتر، أشجار مثمرة" }
      - { name: description, label: الوصف (فقرات), widget: list, min: 1, field: { name: paragraph, label: فقرة, widget: text } }
      - { name: images, label: الصور, widget: list, min: 1, field: { name: image, label: صورة, widget: image }, hint: "الصورة الأولى هي صورة الغلاف. لا تُظهر لافتات أو أرقام تدل على الموقع." }
      - { name: publishedAt, label: تاريخ النشر, widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD, default: "{{now}}" }
      - { name: seoTitle, label: "SEO: عنوان الصفحة في جوجل", widget: string, required: false, hint: "اختياري. اتركه فارغاً ليُولَّد تلقائياً من العنوان والكود. يُفضّل أقل من 60 حرفاً." }
      - { name: seoDescription, label: "SEO: الوصف في نتائج البحث", widget: text, required: false, hint: "اختياري. 120–160 حرفاً تقريباً." }

  - name: articles
    label: المقالات
    label_singular: مقال
    folder: content/articles
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{urlSlug}}"
    summary: "{{title}}"
    sortable_fields: [publishedAt, title]
    fields:
      - { name: title, label: العنوان, widget: string }
      - { name: urlSlug, label: رابط المقال بالإنجليزية, widget: string, hint: "حروف إنجليزية صغيرة وشرطات فقط، مثل: farm-prices-2027. لا يتغير بعد النشر.", pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "حروف إنجليزية صغيرة وأرقام وشرطات فقط"] }
      - { name: excerpt, label: ملخص قصير, widget: text }
      - { name: image, label: الصورة الرئيسية, widget: image }
      - { name: category, label: التصنيف, widget: select, options: [دليل الشراء, قانوني, دليل المناطق, إيجار يومي, استثمار, أخبار السوق] }
      - { name: publishedAt, label: تاريخ النشر, widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD, default: "{{now}}" }
      - { name: readMinutes, label: مدة القراءة (دقائق), widget: number, value_type: int, required: false, hint: اتركه فارغاً ليُحسب تلقائياً }
      - { name: keyTakeaways, label: خلاصة سريعة, widget: list, field: { name: point, label: نقطة, widget: string }, hint: 3 إلى 5 نقاط تلخص المقال }
      - { name: body, label: نص المقال, widget: markdown, hint: "استخدم العناوين (H2) بصيغة أسئلة مثل: ما هي أسعار المزارع في دروشا؟ للروابط الداخلية استخدم مسارات مثل /areas/drousha" }
      - name: faqs
        label: الأسئلة الشائعة
        widget: list
        required: false
        fields:
          - { name: q, label: السؤال, widget: string }
          - { name: a, label: الجواب, widget: text }
      - { name: seoTitle, label: "SEO: عنوان الصفحة في جوجل", widget: string, required: false, hint: اختياري. اتركه فارغاً لاستخدام عنوان المقال }
      - { name: seoDescription, label: "SEO: الوصف في نتائج البحث", widget: text, required: false, hint: اختياري. اتركه فارغاً لاستخدام الملخص }

  - name: areas
    label: المناطق
    label_singular: منطقة
    description: كل منطقة تولّد تلقائياً صفحتها وصفحات «النوع + المنطقة» ومزارع الإيجار اليومي فيها.
    folder: content/areas
    extension: json
    format: json
    create: true
    delete: false
    slug: "{{urlSlug}}"
    summary: "{{fullName}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: الاسم المختصر, widget: string, hint: "مثال: عرطوز" }
      - { name: fullName, label: الاسم الكامل, widget: string, hint: "مثال: عرطوز وجديدة عرطوز" }
      - { name: urlSlug, label: الرابط بالإنجليزية, widget: string, hint: "مثل: yaafour. لا يتغير بعد النشر.", pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "حروف إنجليزية صغيرة وشرطات فقط"] }
      - { name: codePrefix, label: بادئة أكواد العقارات, widget: string, hint: "حرف إلى 3 حروف إنجليزية لا تتكرر، مثل YF", pattern: ['^[A-Za-z]{1,3}$', "1–3 حروف إنجليزية"] }
      - { name: order, label: الترتيب, widget: number, value_type: int, default: 10, hint: الأصغر يظهر أولاً }
      - { name: tagline, label: سطر تعريفي, widget: string }
      - { name: intersectionHook, label: ميزة تُضاف لعناوين صفحات النوع, widget: string, required: false, hint: "مثال: طابو أخضر ومياه وفيرة ← «مزارع للبيع في الدرخبية (طابو أخضر ومياه وفيرة)»" }
      - { name: distance, label: المسافة عن دمشق, widget: string }
      - { name: water, label: المياه, widget: string }
      - { name: commonDeeds, label: أنواع الملكية الشائعة, widget: string }
      - { name: image, label: صورة المنطقة, widget: image }
      - name: geo
        label: الإحداثيات (للخرائط ومحركات البحث)
        widget: object
        collapsed: true
        fields:
          - { name: lat, label: خط العرض, widget: number, value_type: float }
          - { name: lng, label: خط الطول, widget: number, value_type: float }
      - { name: highlights, label: مزايا مختصرة, widget: list, field: { name: item, label: ميزة, widget: string } }
      - { name: keyTakeaways, label: خلاصة سريعة, widget: list, field: { name: point, label: نقطة, widget: string } }
      - { name: overview, label: النبذة (فقرات), widget: list, min: 1, field: { name: paragraph, label: فقرة, widget: text }, hint: نحو 200 كلمة عن المنطقة }
      - name: priceGuide
        label: مؤشرات الأسعار
        widget: list
        fields:
          - { name: label, label: البند, widget: string }
          - { name: value, label: السعر التقريبي, widget: string }
      - name: priceIndex
        label: أرقام مؤشر الأسعار (/price-index) بالدولار
        widget: object
        collapsed: true
        required: false
        fields:
          - name: agriDunum
            label: الدونم الزراعي ($ للدونم)
            widget: object
            fields: &rangeFields
              - { name: min, label: من, widget: number, value_type: int }
              - { name: max, label: إلى, widget: number, value_type: int }
          - { name: plotM2, label: متر المقسم المعد للبناء ($ للمتر), widget: object, fields: *rangeFields }
          - { name: apartmentM2, label: متر الشقة السكنية ($ للمتر), widget: object, fields: *rangeFields }
          - { name: villaM2, label: متر الفيلا المبنية ($ للمتر), widget: object, fields: *rangeFields }
          - { name: finishingM2, label: إكساء المتر المربع ($ للمتر), widget: object, fields: *rangeFields }
          - { name: dailyRent, label: إيجار المزرعة اليومي ($ لليوم), widget: object, fields: *rangeFields }
          - name: trend
            label: اتجاه السوق
            widget: select
            options:
              - { label: صاعد, value: up }
              - { label: مستقر, value: stable }
              - { label: هابط, value: down }
      - name: faqs
        label: الأسئلة الشائعة
        widget: list
        fields:
          - { name: q, label: السؤال, widget: string }
          - { name: a, label: الجواب, widget: text }

  - name: projects
    label: مشاريع التعهدات (قبل وبعد)
    label_singular: مشروع
    description: تظهر في صفحة التعهدات والإكساء كمقارنة «قبل / بعد» بالسحب.
    folder: content/projects
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{urlSlug}}"
    summary: "{{title}}"
    sortable_fields: [order, year, title]
    fields:
      - { name: title, label: عنوان المشروع, widget: string }
      - { name: urlSlug, label: معرّف بالإنجليزية, widget: string, hint: "مثل: villa-darkhabiyah-2026", pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "حروف إنجليزية صغيرة وشرطات فقط"] }
      - name: category
        label: نوع المشروع
        widget: select
        options:
          - { label: بناء, value: build }
          - { label: إكساء, value: finishing }
          - { label: مسابح وتجهيز, value: pool }
          - { label: ترميم, value: renovation }
      - { name: area, label: المنطقة, widget: relation, collection: areas, value_field: "{{slug}}", search_fields: [name, fullName], display_fields: [fullName] }
      - { name: before, label: صورة «قبل», widget: image }
      - { name: after, label: صورة «بعد», widget: image, hint: "يُفضّل أن تكون الصورتان من نفس الزاوية ونفس الأبعاد" }
      - { name: description, label: وصف مختصر, widget: text, required: false }
      - { name: duration, label: مدة التنفيذ, widget: string, required: false, hint: "مثال: 4 أشهر" }
      - { name: year, label: سنة التنفيذ, widget: number, value_type: int, required: false }
      - { name: order, label: الترتيب, widget: number, value_type: int, default: 10 }
      - { name: isExample, label: مثال توضيحي (ليس مشروعاً حقيقياً), widget: boolean, default: false, required: false, hint: "أزل هذا الخيار عند رفع مشروع حقيقي منفّذ" }

  - name: pages
    label: محتوى الصفحات
    description: نصوص الصفحات الرئيسية وعناوين ووصف SEO لكل صفحة.
    format: json
    files:
      - name: home
        label: الصفحة الرئيسية
        file: content/pages/home.json
        fields:
          - name: seo
            label: SEO
            widget: object
            fields:
              - { name: title, label: عنوان الصفحة في جوجل, widget: string }
              - { name: description, label: الوصف في نتائج البحث, widget: text }
          - name: hero
            label: الواجهة الرئيسية
            widget: object
            fields:
              - { name: badge, label: الشارة الصغيرة, widget: string }
              - { name: title, label: العنوان الرئيسي, widget: string }
              - { name: titleHighlight, label: الجزء الذهبي من العنوان, widget: string }
              - { name: subtitle, label: النص تحت العنوان, widget: text }
              - { name: image, label: صورة الخلفية, widget: image }
              - { name: imageAlt, label: وصف الصورة, widget: string }
          - name: areasSection
            label: قسم المناطق
            widget: object
            collapsed: true
            fields:
              - { name: title, label: العنوان, widget: string }
              - { name: subtitle, label: النص, widget: string }
          - name: saleSection
            label: قسم العقارات للبيع
            widget: object
            collapsed: true
            fields:
              - { name: title, label: العنوان, widget: string }
          - name: dailySection
            label: قسم الإيجار اليومي
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: النص الصغير, widget: string }
              - { name: title, label: العنوان, widget: string }
              - { name: text, label: النص, widget: text }
              - { name: button, label: نص الزر, widget: string }
          - name: contractingSection
            label: قسم التعهدات والإكساء
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: النص الصغير, widget: string }
              - { name: title, label: العنوان, widget: string }
              - { name: text, label: النص, widget: text }
              - { name: button, label: نص الزر الذهبي, widget: string }
              - { name: secondaryButton, label: نص زر الحاسبة, widget: string }
              - { name: image, label: الصورة, widget: image }
          - name: trust
            label: قسم «لماذا نحن»
            widget: object
            collapsed: true
            fields:
              - { name: title, label: العنوان, widget: string }
              - { name: subtitle, label: النص, widget: string }
              - name: items
                label: البطاقات
                widget: list
                fields:
                  - name: icon
                    label: الأيقونة
                    widget: select
                    options:
                      - { label: دبوس موقع, value: map-pin }
                      - { label: فحص مستند, value: file-search }
                      - { label: يد وعملات, value: hand-coins }
                      - { label: كرة أرضية, value: globe }
                      - { label: درع, value: shield }
                      - { label: كاميرا, value: camera }
                      - { label: مصافحة, value: handshake }
                      - { label: نجمة, value: star }
                  - { name: title, label: العنوان, widget: string }
                  - { name: text, label: النص, widget: text }
          - name: blogSection
            label: قسم المقالات
            widget: object
            collapsed: true
            fields:
              - { name: title, label: العنوان, widget: string }
          - { name: faqTitle, label: عنوان الأسئلة الشائعة, widget: string }
          - name: faqs
            label: الأسئلة الشائعة
            widget: list
            fields:
              - { name: q, label: السؤال, widget: string }
              - { name: a, label: الجواب, widget: text }
          - name: cta
            label: الدعوة الختامية
            widget: object
            collapsed: true
            fields:
              - { name: title, label: العنوان, widget: string }
              - { name: text, label: النص, widget: text }
              - { name: primaryLabel, label: نص الزر الذهبي, widget: string }
              - { name: secondaryLabel, label: نص الزر الثاني, widget: string }

      - name: about
        label: من نحن
        file: content/pages/about.json
        fields:
          - name: seo
            label: SEO
            widget: object
            fields:
              - { name: title, label: عنوان الصفحة في جوجل, widget: string }
              - { name: description, label: الوصف في نتائج البحث, widget: text }
          - { name: title, label: العنوان, widget: string }
          - { name: subtitle, label: النص تحت العنوان, widget: text }
          - { name: body, label: المحتوى, widget: markdown }
          - { name: workflowTitle, label: عنوان خطوات العمل, widget: string }
          - name: workflow
            label: خطوات العمل
            widget: list
            fields:
              - { name: title, label: الخطوة, widget: string }
              - { name: text, label: الشرح, widget: text }
          - name: faqs
            label: الأسئلة الشائعة
            widget: list
            fields:
              - { name: q, label: السؤال, widget: string }
              - { name: a, label: الجواب, widget: text }

      - name: submit-property
        label: أضف عقارك
        file: content/pages/submit-property.json
        fields:
          - name: seo
            label: SEO
            widget: object
            fields:
              - { name: title, label: عنوان الصفحة في جوجل, widget: string }
              - { name: description, label: الوصف في نتائج البحث, widget: text }
          - { name: title, label: العنوان, widget: string }
          - { name: subtitle, label: النص تحت العنوان, widget: text }
          - name: steps
            label: الخطوات
            widget: list
            fields:
              - { name: title, label: الخطوة, widget: string }
              - { name: text, label: الشرح, widget: string }
          - { name: submitLabel, label: نص زر الإرسال, widget: string }
          - { name: formNote, label: ملاحظة تحت الزر, widget: text }

      - name: request-property
        label: اطلب عقارك
        file: content/pages/request-property.json
        fields:
          - name: seo
            label: SEO
            widget: object
            fields:
              - { name: title, label: عنوان الصفحة في جوجل, widget: string }
              - { name: description, label: الوصف في نتائج البحث, widget: text }
          - { name: title, label: العنوان, widget: string }
          - { name: subtitle, label: النص تحت العنوان, widget: text }
          - { name: intro, label: صندوق «كيف تعمل الخدمة», widget: markdown }
          - { name: submitLabel, label: نص زر الإرسال, widget: string }
          - { name: formNote, label: ملاحظة تحت الزر, widget: text }

      - name: listings
        label: صفحات الأقسام (SEO)
        file: content/pages/listings.json
        fields:
          - name: forSale
