            fields:
              - { name: title, label: العنوان, widget: string }
              - { name: subtitle, label: النص, widget: text }
              - name: steps
                label: الخطوات
                widget: list
                fields:
                  - { name: title, label: الخطوة, widget: string }
                  - { name: text, label: الشرح, widget: text }
          - name: calculator
            label: حاسبة التكلفة (الأسعار والمدد)
            widget: object
            collapsed: true
            fields:
              - { name: title, label: العنوان, widget: string }
              - { name: subtitle, label: النص, widget: text }
