                label: مستويات التشطيب
                widget: list
                allow_add: false
                allow_remove: false
                fields:
                  - { name: id, label: المعرّف (لا تغيّره), widget: hidden }
                  - { name: label, label: الاسم, widget: string }
                  - { name: description, label: الوصف, widget: string }
              - name: projectTypes
                label: أنواع المشاريع
                widget: list
                fields:
                  - { name: id, label: معرّف بالإنجليزية, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "حروف إنجليزية صغيرة وشرطات فقط"] }
                  - { name: label, label: اسم المشروع, widget: string }
                  - name: unit
                    label: الوحدة
                    widget: select
                    options:
                      - { label: متر مربع, value: m2 }
                      - { label: دونم, value: dunum }
                  - { name: qtyLabel, label: اسم حقل المساحة, widget: string, hint: "مثال: مساحة الشقة" }
                  - { name: defaultQty, label: المساحة الافتراضية, widget: number, value_type: float }
                  - { name: minQty, label: أقل مساحة, widget: number, value_type: float }
                  - { name: maxQty, label: أكبر مساحة, widget: number, value_type: float }
                  - { name: step, label: خطوة المؤشر, widget: number, value_type: float }
                  - name: perUnit
                    label: السعر لكل وحدة ($)
                    widget: object
                    fields: &levelPrices
                      - { name: economy, label: عملي اقتصادي, widget: number, value_type: int }
                      - { name: deluxe, label: ديلوكس, widget: number, value_type: int }
                      - { name: super, label: سوبر ديلوكس ملكي, widget: number, value_type: int }
                  - { name: fixed, label: تكلفة ثابتة للمشروع ($) — مثل التراخيص أو منظومة الفلترة أو البئر, widget: object, fields: *levelPrices }
                  - { name: baseDays, label: أيام التنفيذ الأساسية, widget: number, value_type: int }
                  - { name: daysPerUnit, label: أيام إضافية لكل وحدة, widget: number, value_type: float }
          - { name: projectsTitle, label: عنوان معرض المشاريع, widget: string }
          - { name: projectsSubtitle, label: نص معرض المشاريع, widget: string, hint: "المشاريع نفسها تُدار من قسم «مشاريع التعهدات»" }
          - name: faqs
            label: الأسئلة الشائعة
            widget: list
            fields:
              - { name: q, label: السؤال, widget: string }
              - { name: a, label: الجواب, widget: text }
          - name: cta
            label: الدعوة الختامية
            widget: object
            collapsed: true
            fields:
              - { name: title, label: العنوان, widget: string }
              - { name: text, label: النص, widget: text }
              - { name: button, label: نص الزر, widget: string }
          - name: propertyCallout
            label: صندوق «جاهز ع المفتاح» في صفحات العقارات
            widget: object
            collapsed: true
            fields:
              - { name: title, label: العنوان, widget: string }
              - { name: text, label: النص, widget: text }
              - { name: button, label: نص زر واتساب, widget: string }
              - { name: secondary, label: نص زر الحاسبة, widget: string }

      - name: price-index
        label: مؤشر الأسعار
        file: content/pages/price-index.json
        fields:
          - name: seo
            label: SEO
            widget: object
            fields:
              - { name: title, label: عنوان الصفحة في جوجل, widget: string }
              - { name: description, label: الوصف في نتائج البحث, widget: text }
          - { name: title, label: العنوان (H1), widget: string }
          - { name: subtitle, label: النص تحت العنوان, widget: text }
          - { name: updatedAt, label: تاريخ آخر تحديث, widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD, hint: "حدّثه كلما عدّلت الأرقام. الأرقام نفسها في قسم «المناطق»" }
          - { name: keyTakeaways, label: خلاصة سريعة, widget: list, field: { name: point, label: نقطة, widget: string } }
          - { name: methodology, label: كيف نحسب المؤشر, widget: markdown }
          - name: faqs
            label: الأسئلة الشائعة
            widget: list
            fields:
              - { name: q, label: السؤال, widget: string }
              - { name: a, label: الجواب, widget: text }

  - name: custom-pages
    label: صفحات إضافية
    label_singular: صفحة
    description: صفحات حرة مثل سياسة الخصوصية أو العروض. رابطها يكون /page/الرابط — أضفه للقوائم من «الإعدادات».
    folder: content/custom-pages
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{urlSlug}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: العنوان, widget: string }
      - { name: urlSlug, label: الرابط بالإنجليزية, widget: string, hint: "مثل: offers ← يصبح الرابط /page/offers", pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "حروف إنجليزية صغيرة وشرطات فقط"] }
      - { name: image, label: صورة, widget: image, required: false }
      - { name: body, label: المحتوى, widget: markdown }
      - { name: seoTitle, label: "SEO: عنوان الصفحة في جوجل", widget: string, required: false }
      - { name: seoDescription, label: "SEO: الوصف في نتائج البحث", widget: text, required: false }

  - name: settings
    label: الإعدادات
    format: json
    files:
      - name: site
        label: إعدادات الموقع العامة
        file: content/settings/site.json
        fields:
          - { name: name, label: اسم المنصة, widget: string }
          - { name: nameEn, label: الاسم بالإنجليزية, widget: string }
          - { name: shortName, label: الاسم المختصر, widget: string, hint: يظهر بعد عنوان كل صفحة في جوجل }
          - { name: defaultTitle, label: "SEO: العنوان الافتراضي", widget: string }
          - { name: description, label: "SEO: الوصف الافتراضي", widget: text }
          - { name: ogImage, label: صورة المشاركة (واتساب وفيسبوك), widget: image, hint: "1200×630 بكسل" }
          - { name: whatsapp, label: رقم الواتساب, widget: string, hint: "بالصيغة الدولية بدون + أو 00، مثل 963991111474. كل أزرار الموقع والنماذج ترسل إليه." }
          - { name: email, label: البريد الإلكتروني, widget: string }
          - { name: addressRegion, label: المنطقة / العنوان العام, widget: string }
          - { name: whatsappGreeting, label: رسالة واتساب الافتراضية, widget: string }
          - { name: propertyTrustNote, label: ملاحظة الثقة تحت زر الحجز, widget: text }
          - { name: soldBanner, label: نص شريط «تم البيع», widget: string }
          - { name: footerAbout, label: نبذة أسفل الموقع, widget: text }
      - name: navigation
        label: القوائم
        file: content/settings/navigation.json
        fields:
          - name: header
            label: القائمة العلوية
            widget: list
            fields:
              - { name: label, label: النص, widget: string }
              - { name: href, label: الرابط, widget: string, hint: "مثل /for-sale أو /page/offers" }
              - { name: highlight, label: إبراز بإطار ذهبي, widget: boolean, default: false, required: false }
          - name: footerLinks
            label: روابط أسفل الموقع
            widget: list
            fields:
              - { name: label, label: النص, widget: string }
              - { name: href, label: الرابط, widget: string }
