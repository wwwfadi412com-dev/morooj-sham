# Builds the static site and publishes it to GitHub Pages on every push to
# main — including the commits made by the /admin panel.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an older queued run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Clear BASE_PATH and set SITE_URL to https://moroojsham.com when the custom domain is connected.
      NEXT_PUBLIC_BASE_PATH: /morooj-sham
      NEXT_PUBLIC_SITE_URL: https://wwwfadi412com-dev.github.io/morooj-sham
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Without this GitHub Pages runs Jekyll, which drops the _next/ folder.
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
